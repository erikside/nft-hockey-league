name = "ecosphere-rpc-proxy"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Variables non-secrètes (visibles dans le repo — OK)
[vars]
ALLOWED_ORIGINS = "https://ecosphere.io,http://localhost:3000"

# Secrets à définir APRÈS déploiement, jamais ici :
#   wrangler secret put RPC_URL_AMOY
#   wrangler secret put RPC_URL_POLYGON
#
# KV optionnel pour le rate limiting (sinon le proxy fonctionne sans limite) :
#   wrangler kv:namespace create RATE_LIMIT_KV
# puis décommenter et remplir l'id ci-dessous :
#
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "REMPLACER_PAR_ID_REEL"
