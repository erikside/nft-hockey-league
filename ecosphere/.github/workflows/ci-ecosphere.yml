name: CI - EcoSphere (ECKO)

on:
  push:
    branches: [main, develop]
    paths:
      - "ecosphere/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "ecosphere/**"

defaults:
  run:
    working-directory: ecosphere

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ecosphere/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run tests
        run: npx hardhat test

      - name: Check contract size
        run: npx hardhat size-contracts || true

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        id: slither
        with:
          target: "ecosphere/"
          node-version: 20
          fail-on: high
          sarif: slither-results.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Lint Solidity (solhint)
        run: npx solhint 'contracts/**/*.sol' || true
