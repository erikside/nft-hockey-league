<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">HockeyNFTLeague rink and NFT jersey display</title>
  <desc id="desc">A stylized ice rink with three collectible fictional hockey jerseys.</desc>
