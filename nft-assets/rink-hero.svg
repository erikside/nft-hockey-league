    <rect x="118" y="170" width="664" height="472" rx="34" fill="none" stroke="#10243a" stroke-width="10" opacity="0.72"/>
    <path d="M450 170v472M118 406h664" stroke="#ff4f5f" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <circle cx="450" cy="406" r="82" fill="none" stroke="#10243a" stroke-width="10" opacity="0.62"/>
    <circle cx="252" cy="282" r="58" fill="none" stroke="#10243a" stroke-width="7" opacity="0.36"/>
    <circle cx="648" cy="530" r="58" fill="none" stroke="#10243a" stroke-width="7" opacity="0.36"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="210" y="246" width="212" height="310" rx="24" fill="#10151f" transform="rotate(-9 316 401)"/>
    <rect x="241" y="276" width="150" height="150" rx="22" fill="url(#cardB)" transform="rotate(-9 316 351)"/>
    <text x="274" y="470" fill="#f6f8fb" font-family="Arial, sans-serif" font-size="28" font-weight="800" transform="rotate(-9 274 470)">EPIC</text>
    <text x="274" y="506" fill="#a9b6c7" font-family="Arial, sans-serif" font-size="18" transform="rotate(-9 274 506)">#0444</text>
  </g>
  <g filter="url(#shadow)">
