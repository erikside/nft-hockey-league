<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">HockeyNFTLeague rink and NFT card stack</title>
  <desc id="desc">A stylized ice rink with three collectible hockey NFT cards.</desc>
  <defs>
    <linearGradient id="ice" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d9fbff"/>
      <stop offset="0.52" stop-color="#8de8ff"/>
      <stop offset="1" stop-color="#73ffd0"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff4f5f"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#bfa8ff"/>
      <stop offset="1" stop-color="#73ffd0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="22" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="900" height="900" fill="none"/>
